name: CI/CD Zero-to-Deploy

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/afric-hello-devops
  CONTAINER_NAME: afric-hello-devops

jobs:

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build & run tests
        run: mvn clean verify -B
        working-directory: hello-devops
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: hello-devops/target/surefire-reports/

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: hello-devops
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm   ${{ env.CONTAINER_NAME }} || true
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -p 8080:8080 \
              ${{ env.IMAGE_NAME }}:latest
            docker image prune -f
            sleep 5
            docker ps | grep ${{ env.CONTAINER_NAME }}

  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build-push, deploy]
    if: always()
    steps:
      - name: Pipeline status
        run: |
          echo "======================================"
          echo "  PIPELINE SUMMARY"
          echo "======================================"
          echo "  Build & Test : ${{ needs.build-and-test.result }}"
          echo "  Docker Push  : ${{ needs.docker-build-push.result }}"
          echo "  Deploy       : ${{ needs.deploy.result }}"
          echo "======================================"
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "DEPLOYMENT SUCCESSFUL"
          else
            echo "PIPELINE FAILED"
            exit 1
          fi
